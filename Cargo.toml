[package]
name = "lm"
version = "0.1.0"
edition = "2021"

# The machine, the forge that builds images for it, and the bench that checks
# both. The three binaries follow the same seam.
[lib]
name = "lm"
path = "src/lib.rs"

# The runtime. Boots an image; knows nothing about building one.
[[bin]]
name = "lm"
path = "src/bin/lm.rs"

# The build tool.
[[bin]]
name = "lmforge"
path = "src/bin/lmforge.rs"

# The test bench.
[[bin]]
name = "lmdev"
path = "src/bin/lmdev.rs"

[dependencies]
bytemuck = "1"
clap = { version = "4", features = ["derive"] }
num-bigint = "0.5.1"
num-traits = "0.2.19"
pollster = "1"
# Every native backend, and no browser one.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "metal", "vulkan", "gles"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
opt-level = 1
